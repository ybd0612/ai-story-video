name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: app/create-video/package-lock.json
      # 不装 ffmpeg / 不装 edge-tts：测试不依赖外部程序。
      # migrate-layout 与 tts-retry 两个用例会因缺少 data/ 个人主源或可用 Python 解释器
      # 而带原因 skip，属预期语义（见 docs/PROJECT_INDEX.md §2.4）。
      - name: Install
        working-directory: app/create-video
        run: npm ci
      - name: Typecheck
        working-directory: app/create-video
        run: npm run typecheck
      - name: Test
        working-directory: app/create-video
        run: npm test
